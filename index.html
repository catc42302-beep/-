<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مركز القيادة">
<meta name="theme-color" content="#0a0c10">
<title>مركز القيادة</title>
<style>
/* زر تثبيت التطبيق */
#pwa-install-btn {
  display: none;
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  z-index: 9000; background: var(--accent); color: #fff;
  border: none; border-radius: 99px; font-family: var(--font);
  font-size: 13px; font-weight: 700; padding: 10px 22px;
  cursor: pointer; box-shadow: 0 4px 20px rgba(29,158,117,0.5);
  white-space: nowrap; animation: bounce 2s infinite;
}
@keyframes bounce {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-4px); }
}
#pwa-install-btn.visible { display: flex; align-items: center; gap: 6px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0c10;
  --bg2: #111418;
  --bg3: #181c23;
  --bg4: #1e2330;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #e8eaf0;
  --text2: #8b90a0;
  --text3: #555b6e;
  --accent: #1D9E75;
  --accent2: #16795a;
  --blue: #378ADD;
  --amber: #BA7517;
  --coral: #D85A30;
  --purple: #7F77DD;
  --red: #E24B4A;
  --sidebar-w: 225px;
  --font: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
}

/* ===== THEMES ===== */
html[data-theme="light"]  { --bg:#f0f2f5; --bg2:#ffffff; --bg3:#e8eaed; --bg4:#dde0e6; --border:rgba(0,0,0,0.08); --border2:rgba(0,0,0,0.15); --text:#1a1a2e; --text2:#555770; --text3:#9097b0; --accent:#1D9E75; --accent2:#16795a; --red:#E24B4A; --amber:#BA7517; }

html[data-theme="navy"]   { --bg:#080d1a; --bg2:#0d1426; --bg3:#121c35; --bg4:#1a2847; --border:rgba(100,160,255,0.08); --border2:rgba(100,160,255,0.16); --text:#dce8ff; --text2:#7a92c0; --text3:#3d5480; --accent:#3b82f6; --accent2:#2563eb; }
html[data-theme="purple"] { --bg:#0c0812; --bg2:#130d1e; --bg3:#1b1129; --bg4:#251836; --border:rgba(180,130,255,0.08); --border2:rgba(180,130,255,0.16); --text:#ece0ff; --text2:#9b7ec8; --text3:#5c3d8a; --accent:#a855f7; --accent2:#9333ea; }
html[data-theme="gold"]   { --bg:#0a0900; --bg2:#141100; --bg3:#1d1800; --bg4:#272200; --border:rgba(255,200,50,0.08); --border2:rgba(255,200,50,0.16); --text:#fff8dc; --text2:#c8a94a; --text3:#7a6420; --accent:#f59e0b; --accent2:#d97706; }
html[data-theme="olive"]  { --bg:#080c06; --bg2:#0f1509; --bg3:#161e0f; --bg4:#1f2a14; --border:rgba(150,200,80,0.08); --border2:rgba(150,200,80,0.16); --text:#e8f5d0; --text2:#8aab5a; --text3:#4a6528; --accent:#84cc16; --accent2:#65a30d; }

/* ===== THEME SWITCHER ===== */
.theme-switcher { position:relative; display:inline-flex; align-items:center; }
.theme-toggle-btn { background:transparent; border:none; cursor:pointer; font-size:16px; line-height:1; padding:2px 4px; transition:all 0.15s; }
.theme-toggle-btn:hover { transform:scale(1.15); }
.theme-picker { display:none; position:absolute; top:calc(100% + 6px); left:50%; transform:translateX(-50%); background:var(--bg2); border:1px solid var(--border2); border-radius:10px; padding:6px; z-index:9999; box-shadow:0 8px 30px rgba(0,0,0,0.5); flex-direction:row; gap:4px; white-space:nowrap; }
.theme-picker.open { display:flex; }
.theme-opt { cursor:pointer; border-radius:50%; padding:2px; border:2px solid transparent; transition:all 0.15s; }
.theme-opt:hover { border-color:var(--border2); transform:scale(1.1); }
.theme-opt.active { border-color:var(--accent); }
.theme-dot { display:block; width:18px; height:18px; border-radius:50%; }

/* ===== TABS AS DROPDOWN ===== */
.tab-bar { position:relative; margin-bottom:0.8rem; }
.tab-dropdown-btn { display:flex; align-items:center; justify-content:space-between; width:100%; padding:7px 11px; border-radius:8px; background:var(--bg2); border:1px solid var(--border2); color:var(--text); font-family:var(--font); font-size:12px; font-weight:600; cursor:pointer; transition:all 0.18s; gap:6px; }
.tab-dropdown-btn:hover, .tab-dropdown-btn.open { border-color:var(--accent); }
.tab-dd-label { display:flex; align-items:center; gap:5px; flex:1; }
.tab-dd-arrow { font-size:9px; color:var(--text3); transition:transform 0.2s; }
.tab-dropdown-btn.open .tab-dd-arrow { transform:rotate(180deg); }
.tab-dropdown-btn .tab-count { font-size:10px; padding:1px 6px; border-radius:999px; background:rgba(29,158,117,0.15); color:var(--accent); }
.tab-dropdown-menu { display:none; position:absolute; top:calc(100% + 3px); right:0; left:0; background:var(--bg2); border:1px solid var(--border2); border-radius:9px; z-index:500; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,0.35); }
.tab-dropdown-menu.open { display:block; }
.tab-dd-item { display:flex; align-items:center; gap:7px; padding:8px 12px; font-size:12px; font-weight:500; color:var(--text2); cursor:pointer; transition:all 0.13s; border-bottom:1px solid var(--border); }
.tab-dd-item:last-child { border-bottom:none; }
.tab-dd-item:hover { background:var(--bg3); color:var(--text); }
.tab-dd-item.active { color:var(--accent); background:rgba(29,158,117,0.08); font-weight:600; }
.tab-dd-item .tab-count { margin-right:auto; font-size:10px; padding:1px 6px; border-radius:999px; background:var(--bg4); color:var(--text3); }
.tab-dd-item.active .tab-count { background:rgba(29,158,117,0.2); color:var(--accent); }


html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; overflow: hidden; margin: 0; padding: 0; }

/* ===== LAYOUT ===== */
.layout { display: flex; height: 100vh; }

/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--sidebar-w); height: 100vh; flex-shrink: 0;
  background: var(--bg2); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto;
  -webkit-app-region: drag; /* browser compat */
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 1.1rem 1rem 1rem;
  border-bottom: 1px solid var(--border);
  -webkit-app-region: drag;
}
.brand-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #0e6e50);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.brand-name { font-size: 13px; font-weight: 700; color: var(--text); }
.brand-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }

.nav-links { list-style: none; flex: 1; padding: 0.4rem 0.6rem; display: flex; flex-direction: column; gap: 1px; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 11px; border-radius: 9px;
  color: var(--text2); font-size: 13px; font-weight: 500;
  transition: all 0.15s; cursor: pointer; -webkit-app-region: no-drag;
  user-select: none;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: rgba(29,158,117,0.15); color: var(--accent); }
.nav-icon { font-size: 14px; width: 19px; text-align: center; flex-shrink: 0; }

.nav-footer { padding: 0.75rem 1rem; border-top: 1px solid var(--border); }
.streak-badge {
  font-size: 12px; color: var(--amber);
  background: rgba(186,117,23,0.1); border: 1px solid rgba(186,117,23,0.25);
  border-radius: 20px; padding: 5px 12px; text-align: center; margin-bottom: 6px;
}
.save-status {
  font-size: 11px; text-align: center; padding: 4px;
  border-radius: 20px; transition: all 0.3s;
}
.save-status.saved { color: var(--accent); }
.save-status.saving { color: var(--amber); }
.save-status.error { color: var(--red); }

/* ===== MAIN ===== */
.main-content {
  flex: 1; height: 100vh; overflow-y: auto;
  padding: 1.75rem 2rem 3rem;
}

.page { display: none; }
.page.active { display: block; animation: fadeIn 0.18s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

/* ===== PAGE HEADER ===== */
.page-header { margin-bottom: 1.5rem; display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.page-title { font-size: 21px; font-weight: 700; color: var(--text); }
.page-sub { font-size: 12px; color: var(--text2); margin-top: 3px; }

/* ===== STATS ===== */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 9px; margin-bottom: 1.25rem; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 0.875rem 1rem; }
.stat-val { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1; }
.stat-lbl { font-size: 11px; color: var(--text2); margin-top: 5px; }
.stat-sub { font-size: 11px; margin-top: 2px; }

/* ===== CARDS ===== */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 13px; padding: 1.1rem 1.4rem; margin-bottom: 0.9rem; }
.card-title { font-size: 11px; font-weight: 600; color: var(--text3); margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
.card-title-lg { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 0.9rem; }

/* ===== PROGRESS ===== */
.prog-wrap { margin: 0.45rem 0; }
.prog-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-bottom: 5px; }
.prog-bar { height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1); }

/* ===== GRIDS ===== */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }

/* ===== INPUTS ===== */
.input-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 0.75rem; }
.input-group label { font-size: 11px; color: var(--text2); font-weight: 600; }
.input-group input, .input-group select, .input-group textarea {
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--text); font-family: var(--font);
  font-size: 13px; padding: 8px 10px; outline: none; width: 100%;
  transition: border-color 0.15s;
}
.input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: var(--accent); }
.input-group textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

/* ===== BUTTONS ===== */
.btn {
  background: var(--accent); color: #fff; border: none; border-radius: 8px;
  font-family: var(--font); font-size: 13px; font-weight: 600;
  padding: 8px 16px; cursor: pointer; white-space: nowrap;
  transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
}
.btn:hover { background: var(--accent2); }
.btn-ghost {
  background: var(--bg3); color: var(--text2); border: 1px solid var(--border2);
  border-radius: 8px; font-family: var(--font); font-size: 12px;
  padding: 6px 12px; cursor: pointer; transition: all 0.15s;
}
.btn-ghost:hover { color: var(--text); background: var(--bg4); }
.btn-red { background: rgba(226,75,74,0.15); color: var(--red); border: 1px solid rgba(226,75,74,0.3); }
.btn-red:hover { background: rgba(226,75,74,0.28); }

/* ===== ADD ROW ===== */
.add-row {
  display: flex; gap: 7px; margin-bottom: 1rem;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 11px; padding: 0.65rem; flex-wrap: wrap;
}
.add-row input, .add-row select {
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 7px; color: var(--text); font-family: var(--font);
  font-size: 13px; padding: 6px 9px; outline: none;
}
.add-row input { flex: 1; min-width: 130px; }
.add-row input:focus, .add-row select:focus { border-color: var(--accent); }

/* ===== FILTER PILLS ===== */
.filter-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 0.9rem; }
.pill {
  font-size: 11px; padding: 4px 11px; border-radius: 999px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--text2); cursor: pointer; font-family: var(--font); transition: all 0.15s;
}
.pill:hover { color: var(--text); }
.pill.active { background: rgba(29,158,117,0.15); border-color: var(--accent); color: var(--accent); }

/* ===== TABS ===== */
/* tab-btn kept for legacy, overridden by dropdown */
.tab-btn { display:none; }
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fadeIn 0.15s ease; }

/* ===== QURAN ENHANCED ===== */
.quran-pdf-zone {
  border: 2px dashed var(--border2); border-radius: 12px;
  padding: 2rem; text-align: center; cursor: pointer;
  transition: all 0.2s; color: var(--text3);
}
.quran-pdf-zone:hover { border-color: var(--accent); color: var(--accent); background: rgba(29,158,117,0.04); }
.pdf-nav-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; background: var(--bg2); border-bottom: 1px solid var(--border);
  gap: 10px; border-radius: 12px 12px 0 0;
}
.pdf-nav-bar button {
  background: var(--bg3); border: 1px solid var(--border2); color: var(--text2);
  border-radius: 7px; font-family: var(--font); font-size: 12px; font-weight: 600;
  padding: 5px 12px; cursor: pointer; transition: all 0.15s;
}
.pdf-nav-bar button:hover { color: var(--text); background: var(--bg4); }
.pdf-canvas-wrap {
  overflow: auto; max-height: 62vh; display: flex; justify-content: center;
  padding: 10px; background: #1a1a1a; border-radius: 0 0 12px 12px;
}
.quran-track-row {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--bg3); margin-bottom: 6px; transition: all 0.15s;
}
.quran-track-row:hover { border-color: var(--border2); }
.today-mark {
  font-size: 10px; padding: 2px 8px; border-radius: 999px;
  background: rgba(186,117,23,0.15); color: var(--amber);
  border: 1px solid rgba(186,117,23,0.3);
}

/* ===== TODOS ===== */
.todo-list { display: flex; flex-direction: column; gap: 4px; }
.todo-item {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 13px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; transition: border-color 0.15s;
}
.todo-item:hover { border-color: var(--border2); }
.todo-item.done { opacity: 0.35; }
.todo-check {
  width: 19px; height: 19px; border-radius: 50%;
  border: 1.5px solid var(--border2); cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
}
.todo-check:hover { border-color: var(--accent); }
.todo-check.on { border-color: var(--accent); background: var(--accent); }
.todo-check.on::after { content: '✓'; font-size: 11px; color: #fff; font-weight: 700; }
.todo-text { flex: 1; font-size: 13px; color: var(--text); }
.todo-item.done .todo-text { text-decoration: line-through; color: var(--text3); }
.cat-badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; flex-shrink: 0; font-weight: 600; }
.pri-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.del-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 17px; line-height: 1; padding: 0 2px; transition: color 0.15s; }
.del-btn:hover { color: var(--red); }
.section-label { font-size: 11px; color: var(--text3); margin: 10px 0 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

/* ===== QURAN ===== */
.ayah-grid { display: grid; grid-template-columns: repeat(30,1fr); gap: 4px; margin: 0.9rem 0; }
.juz-cell {
  aspect-ratio: 1; border-radius: 5px; background: var(--bg3); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--text3); font-weight: 600;
}
.juz-cell:hover { border-color: var(--accent); transform: scale(1.08); }
.juz-cell.memorized { background: rgba(29,158,117,0.25); border-color: var(--accent); color: var(--accent); }
.juz-cell.reviewing { background: rgba(186,117,23,0.2); border-color: var(--amber); color: var(--amber); }

/* ===== TABLES ===== */
.log-table, .students-table { width: 100%; border-collapse: collapse; }
.log-table th, .students-table th { font-size: 11px; color: var(--text3); font-weight: 600; padding: 7px 0; border-bottom: 1px solid var(--border); text-align: right; }
.log-table td { font-size: 12px; color: var(--text2); padding: 8px 0; border-bottom: 1px solid var(--border); }
.students-table td { font-size: 13px; color: var(--text); padding: 9px 0; border-bottom: 1px solid var(--border); }
.log-table tr:last-child td, .students-table tr:last-child td { border-bottom: none; }

/* ===== SKILL TREE ===== */
.skill-tree { display: flex; flex-direction: column; gap: 7px; }
.skill-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px; border-radius: 10px;
  background: var(--bg3); border: 1px solid var(--border); transition: border-color 0.15s;
}
.skill-item:hover { border-color: var(--border2); }
.skill-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.skill-name { flex: 1; font-size: 13px; color: var(--text); }
.skill-pct { font-size: 12px; color: var(--text2); min-width: 33px; text-align: center; }
.skill-bar-wrap { width: 80px; }
.skill-bar { height: 4px; background: var(--bg4); border-radius: 2px; overflow: hidden; }
.skill-bar-fill { height: 100%; border-radius: 2px; }

/* ===== HABITS ===== */
.habit-row { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.habit-row:last-child { border-bottom: none; }
.habit-name { flex: 1; font-size: 13px; }
.habit-dots { display: flex; gap: 4px; }
.habit-dot { width: 22px; height: 22px; border-radius: 5px; background: var(--bg3); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 10px; transition: all 0.15s; }
.habit-dot.on { background: rgba(29,158,117,0.25); border-color: var(--accent); color: var(--accent); }

/* ===== NOTES ===== */
.notes-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(240px,1fr)); gap: 9px; }
.note-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; }
.note-card.pinned { border-color: rgba(186,117,23,0.35); }

/* ===== EMPTY STATE ===== */
.empty-state { text-align: center; padding: 2.5rem; color: var(--text3); font-size: 13px; }
.empty-icon { font-size: 32px; margin-bottom: 8px; }

/* ===== TOAST ===== */
.toast-wrap { position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%); z-index: 9999; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.toast {
  background: var(--bg3); border: 1px solid var(--border2); color: var(--text);
  padding: 9px 18px; border-radius: 99px; font-size: 13px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  animation: toastIn 0.25s ease; white-space: nowrap;
}
.toast.ok { border-color: rgba(29,158,117,0.5); color: var(--accent); }
.toast.err { border-color: rgba(226,75,74,0.4); color: var(--red); }
@keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
* { scrollbar-width: thin; scrollbar-color: var(--bg3) transparent; }

/* ===== POMODORO ===== */
.pomo-wrap {
  display: flex; flex-direction: column; align-items: center;
  padding: 1rem 0.5rem 0.5rem;
}
.pomo-ring {
  position: relative; width: 130px; height: 130px;
  margin-bottom: 1rem;
}
.pomo-ring svg { transform: rotate(-90deg); }
.pomo-ring-bg { fill: none; stroke: var(--bg4); stroke-width: 8; }
.pomo-ring-fill {
  fill: none; stroke-width: 8; stroke-linecap: round;
  transition: stroke-dashoffset 1s linear, stroke 0.3s;
}
.pomo-time {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);

}

}
.pomo-controls { display: flex; gap: 7px; margin-bottom: 0.8rem; }
.pomo-btn {
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text2); border-radius: 8px; font-family: var(--font);
  font-size: 12px; font-weight: 600; padding: 6px 14px;

}
.pomo-btn:hover { color: var(--text); background: var(--bg4); }
.pomo-btn.active { background: rgba(55,138,221,0.15); border-color: #378ADD; color: #378ADD; }

}

/* ===== TOP NAV BAR ===== */
.top-nav {
  width: 100%; background: var(--bg2);

}
.top-nav-header {

}

.top-brand-icon {

  display: flex; overflow-x: auto; gap: 0;

}
.nav-groups::-webkit-scrollbar { display: none; }
.nav-group {
  display: flex; flex-direction: column; align-items: center;

  min-width: 0;
}
.nav-group:first-child { border-left: none; }
.nav-group-label {
  font-size: 8px; color: var(--text3); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
  padding: 4px 2px 2px; white-space: nowrap;
}
.nav-group-items { display: flex; gap: 1px; }
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 5px 8px 7px; border-radius: 0;
  color: var(--text3); font-size: 11px; font-weight: 500;

}
.nav-item:hover { color: var(--text); background: var(--bg3); }

.nav-icon { font-size: 13px; line-height: 1; }

/* ===== SIDEBAR LEGACY — hidden on new layout ===== */

.sidebar-overlay { display: none; }
.menu-btn { display: none; }

/* ===== LAYOUT OVERRIDE ===== */

.main-content {
  flex: 1; overflow-y: auto;
  padding: 1.25rem 1.75rem 2.5rem;

/* ===== RESPONSIVE MOBILE ===== */
@media (max-width: 700px) {
  .top-nav-header { padding: 0.5rem 0.9rem 0; }

}

@media (max-width: 400px) {

<script>

// ==========================================
// THEME SWITCHER
// ==========================================
function setTheme(t) {
  if (t === 'default') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('mq_theme', t);
  document.querySelectorAll('.theme-opt').forEach(el => el.classList.toggle('active', el.dataset.theme === t));
}
function toggleThemePicker(e) {
  e.stopPropagation();
  document.getElementById('theme-picker').classList.toggle('open');
}
document.addEventListener('click', function() {
  var p = document.getElementById('theme-picker');
  if (p) p.classList.remove('open');
  closeAllDD();
});

// ==========================================
// TAB DROPDOWN HELPERS
// ==========================================
function toggleDD(barId) {
  var bar = document.getElementById(barId);
  if (!bar) return;
  var menu = bar.querySelector('.tab-dropdown-menu');
  var btn  = bar.querySelector('.tab-dropdown-btn');
  var isOpen = menu.classList.contains('open');
  closeAllDD();
  if (!isOpen) { menu.classList.add('open'); if(btn) btn.classList.add('open'); }
}
function closeAllDD() {
  document.querySelectorAll('.tab-dropdown-menu').forEach(function(m){ m.classList.remove('open'); });
  document.querySelectorAll('.tab-dropdown-btn').forEach(function(b){ b.classList.remove('open'); });
}
function buildTabDD(tabs, activeKey, actionFn, countFn) {
  var at = tabs.find(function(t){return t.key===activeKey;}) || tabs[0];
  var ac = countFn(at);
  var iconH = function(t){ return t.icon ? '<span>'+t.icon+'</span>' : ''; };
  var items = tabs.map(function(t) {
    var cnt = countFn(t);
    var cntH = cnt > 0 ? '<span class="tab-count">'+cnt+'</span>' : '';
    var act = t.key === activeKey ? ' active' : '';
    var onclick = actionFn + "('" + t.key + "');closeAllDD()";
    return '<div class="tab-dd-item'+act+'" onclick="'+onclick+'">' + iconH(t) + '<span>'+t.label+'</span>' + cntH + '</div>';
  }).join('');
  var acH = ac > 0 ? '<span class="tab-count">'+ac+'</span>' : '';
  var barId = 'dd-' + Math.random().toString(36).slice(2);
  return '<button class="tab-dropdown-btn" onclick="event.stopPropagation();toggleDD(this.parentElement.id)">'
    + '<span class="tab-dd-label">' + iconH(at) + '<span>'+at.label+'</span></span>'
    + acH + '<span class="tab-dd-arrow">▼</span>'
    + '</button>'
    + '<div class="tab-dropdown-menu">' + items + '</div>';
}
function setQuranTab(k) { _quranTab = k; renderQuran(); }

// Load saved theme on startup
(function(){
  var t = localStorage.getItem('mq_theme') || 'default';
  if (t !== 'default') document.documentElement.setAttribute('data-theme', t);
  window.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('.theme-opt').forEach(function(el){ el.classList.toggle('active', el.dataset.theme===t); });
  });
})();


// ==========================================
// DATABASE — بيحفظ في localStorage في المتصفح
// ==========================================
const LS_KEY = 'markaz_qiyada_v1';
let _data = {};
let _saveTimer = null;

// تحميل البيانات عند البدء
function initDB() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    _data = raw ? JSON.parse(raw) : {};
  } catch(e) {
    _data = {};
  }
  updateSaveStatus('saved');
}

// حفظ فوري (بعد 300ms من آخر تغيير — debounce)
function saveDB() {
  updateSaveStatus('saving');
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(_data));
      updateSaveStatus('saved');
    } catch(e) {
      updateSaveStatus('error');
    }
  }, 300);
}

function updateSaveStatus(status) {
  const el = document.getElementById('save-status');
  if (!el) return;
  el.className = 'save-status ' + status;
  el.textContent = { saved: '✓ محفوظ', saving: '⏳ جاري الحفظ...', error: '⚠ خطأ في الحفظ' }[status];
}

// get/set مع حفظ تلقائي
const DB = {
  get(key, def) { return _data[key] !== undefined ? _data[key] : def; },
  set(key, val) { _data[key] = val; saveDB(); }
};

const TodosDB = {
  getAll() { return DB.get('todos', []); },
  save(t) { DB.set('todos', t); },
  add(text, cat, pri, alarmTime='') { const t = this.getAll(); t.unshift({ id: Date.now(), text, cat, pri, done: false, date: todayStr(), alarmTime, alarmFired: false }); this.save(t); return t; },
  toggle(id) { const t = this.getAll().map(x => x.id===id ? {...x, done:!x.done} : x); this.save(t); return t; },
  del(id) { const t = this.getAll().filter(x => x.id!==id); this.save(t); return t; },
  clearDone() { const t = this.getAll().filter(x => !x.done); this.save(t); return t; },
  edit(id, text) { const t = this.getAll().map(x => x.id===id ? {...x, text} : x); this.save(t); return t; }
};

const HabitsDB = {
  getData() { return DB.get('habits', { list: [
    { id:1, name:'قراءة أذكار الصباح', icon:'🌅', color:'#7F77DD' },
    { id:2, name:'شرب 2 لتر ماء',      icon:'💧', color:'#378ADD' },
    { id:3, name:'تعلم 5 كلمات إنجليزية', icon:'🔤', color:'#1D9E75' },
  ], log:{} }); },
  save(d) { DB.set('habits', d); },
  toggleToday(id) {
    const d = this.getData(), t = todayISOStr();
    if (!d.log[t]) d.log[t] = [];
    d.log[t] = d.log[t].includes(id) ? d.log[t].filter(x=>x!==id) : [...d.log[t], id];
    this.save(d); return d;
  },
  getTodayLog() { return this.getData().log[todayISOStr()] || []; },
  getWeekStats(id) {
    const d = this.getData(); let c = 0;
    for (let i=0; i<7; i++) { const k = daysAgo(i); if ((d.log[k]||[]).includes(id)) c++; }
    return c;
  },
  addHabit(name, icon, color) { const d=this.getData(); d.list.push({id:Date.now(),name,icon:icon||'⭐',color:color||'#1D9E75'}); this.save(d); return d; },
  delHabit(id) { const d=this.getData(); d.list=d.list.filter(h=>h.id!==id); this.save(d); return d; }
};

const QuranDB = {
  getData() {
    return DB.get('quran', {
      memorized:[], reviewing:[], log:[],
      pages: {},
      surahs: {}, // { surahNum: 'memorized' | 'reviewing' | 'none' }
      todaySession: { date:'', hafiz:0, muraja3a:0, notes:'' }
    });
  },
  save(d) { DB.set('quran', d); },
  toggleJuz(juz) {
    const d = this.getData();
    if (d.memorized.includes(juz)) { d.memorized=d.memorized.filter(j=>j!==juz); d.reviewing.push(juz); }
    else if (d.reviewing.includes(juz)) { d.reviewing=d.reviewing.filter(j=>j!==juz); }
    else { d.memorized.push(juz); }
    this.save(d); return d;
  },
  setSurah(num, status) {
    const d = this.getData();
    if (!d.surahs) d.surahs = {};
    if (status === 'none') delete d.surahs[num];
    else d.surahs[num] = status;
    this.save(d); return d;
  },
  addLog(pages, notes) {
    const d=this.getData();
    d.log.unshift({date:todayStr(), pages:+pages, notes});
    this.save(d); return d;
  },
  // تحديث حالة صفحة محددة
  setPageStatus(pageNum, status) {
    const d = this.getData();
    if (!d.pages) d.pages = {};
    if (status === 'none') { delete d.pages[pageNum]; }
    else { d.pages[pageNum] = { status, date: todayStr() }; }
    this.save(d); return d;
  },
  // تسجيل جلسة اليوم
  saveTodaySession(hafiz, muraja3a, notes) {
    const d = this.getData();
    d.todaySession = { date: todayStr(), hafiz: +hafiz||0, muraja3a: +muraja3a||0, notes };
    d.log.unshift({ date: todayStr(), pages: (+hafiz||0)+(+muraja3a||0), hafiz:+hafiz||0, muraja3a:+muraja3a||0, notes });
    this.save(d); return d;
  }
};

const StreakDB = {
  check() {
    let d = DB.get('streak', {count:0,lastDate:''});
    const today = todayISOStr();
    if (d.lastDate === today) return d.count;
    d.count = d.lastDate === daysAgo(1) ? d.count+1 : 1;
    d.lastDate = today;
    DB.set('streak', d);
    return d.count;
  }
};

// ==========================================
// HELPERS
// ==========================================
function todayStr() { return new Date().toLocaleDateString('ar-EG'); }
function todayISOStr() {
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
}
function daysAgo(n) {
  const d = new Date(); d.setDate(d.getDate()-n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ==========================================
// DAY NAVIGATION
// ==========================================
let _viewDate = todayISOStr();

function viewDateStr() {
  const d = new Date(_viewDate + 'T00:00:00');
  return d.toLocaleDateString('ar-EG');
}

function viewDateLabel() {
  const today = todayISOStr();
  const yesterday = daysAgo(1);
  const d = new Date(_viewDate + 'T00:00:00');
  const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const dayName = days[d.getDay()];
  const dateFormatted = d.toLocaleDateString('ar-EG', {day:'numeric', month:'long'});
  if (_viewDate === today) return `اليوم — ${dayName} ${dateFormatted}`;
  if (_viewDate === yesterday) return `أمس — ${dayName} ${dateFormatted}`;
  return `${dayName} ${dateFormatted}`;
}

function addDaysToISO(isoStr, offset) {
  const d = new Date(isoStr + 'T00:00:00');
  d.setDate(d.getDate() + offset);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function goToDay(offset) {
  const iso = addDaysToISO(_viewDate, offset);
  if (iso > todayISOStr()) return;
  _viewDate = iso;
  renderDashboard();
}

function goToToday() {
  _viewDate = todayISOStr();
  renderDashboard();
}

function todoHTML(t) {
  const c=CATS[t.cat];
  // حساب الوقت المتبقي
  let alarmBadge = '';
  if(t.alarmTime && !t.done) {
    const now = new Date();
    const [h,m] = t.alarmTime.split(':').map(Number);
    const alarm = new Date(); alarm.setHours(h,m,0,0);
    const diff = Math.round((alarm - now)/60000);
    let alarmColor = '#1D9E75', alarmText = '';
    if(diff < 0) { alarmColor = '#E24B4A'; alarmText = `⏰ ${t.alarmTime} (تأخر!)`; }
    else if(diff === 0) { alarmColor = '#E24B4A'; alarmText = `⏰ الآن!`; }
    else if(diff < 60) { alarmColor = '#BA7517'; alarmText = `⏰ ${t.alarmTime} (${diff}د)`; }
    else { alarmText = `⏰ ${t.alarmTime}`; }
    alarmBadge = `<span style="font-size:10px;padding:2px 7px;border-radius:999px;background:${alarmColor}22;color:${alarmColor};border:1px solid ${alarmColor}44;white-space:nowrap">${alarmText}</span>`;
  }
  return `<div class="todo-item ${t.done?'done':''}" id="ti-${t.id}">
    <div class="todo-check ${t.done?'on':''}" onclick="toggleTodo(${t.id})"></div>

}

const QuranPDF = {
  pdfDoc: null,
  currentPage: 1,
  totalPages: 0,
  scale: 1.4,
  rendering: false,

  async load(file) {
    if (!window.pdfjsLib) {
      toast('جاري تحميل مكتبة PDF...', 'ok');
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        s.onload = () => {
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          res();
        };
        s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    const arrayBuf = await file.arrayBuffer();
    this.pdfDoc = await pdfjsLib.getDocument({ data: arrayBuf }).promise;
    this.totalPages = this.pdfDoc.numPages;
    this.currentPage = 1;
    // حفظ اسم الملف
    const d = QuranDB.getData();
    d.pdfName = file.name;
    d.pdfCurrentPage = 1;
    QuranDB.save(d);
    this.render();
  },

  async render() {
    if (!this.pdfDoc || this.rendering) return;
    this.rendering = true;
    const page = await this.pdfDoc.getPage(this.currentPage);
    const vp = page.getViewport({ scale: this.scale });
    const canvas = document.getElementById('quran-pdf-canvas');
    if (!canvas) { this.rendering = false; return; }
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    this.rendering = false;
    this.updateNav();
    // حفظ الصفحة الحالية
    const d = QuranDB.getData();
    d.pdfCurrentPage = this.currentPage;
    QuranDB.save(d);
  },

  updateNav() {
    const pg = document.getElementById('pdf-page-info');
    if (pg) pg.textContent = `${this.currentPage} / ${this.totalPages}`;
    const prev = document.getElementById('pdf-prev');
    const next = document.getElementById('pdf-next');
    if (prev) prev.disabled = this.currentPage <= 1;
    if (next) next.disabled = this.currentPage >= this.totalPages;
  },

  goto(n) {
    this.currentPage = Math.max(1, Math.min(this.totalPages, n));
    this.render();
  },

  prev() { this.goto(this.currentPage - 1); },
  next() { this.goto(this.currentPage + 1); },
  zoomIn()  { this.scale = Math.min(3, this.scale + 0.2); this.render(); },
  zoomOut() { this.scale = Math.max(0.5, this.scale - 0.2); this.render(); }
};

async function handleQuranPDF(input) {
  const file = input.files[0];
  if (!file) return;
  toast('جاري تحميل الملف...', 'ok');
  try {
    await QuranPDF.load(file);
    renderQuran();
    toast('✓ تم تحميل القرآن PDF');
  } catch(e) {
    toast('⚠ خطأ في تحميل الملف', 'err');
    console.error(e);
  }
}

function markPdfPage(status) {
  if (!QuranPDF.pdfDoc) return;
  QuranDB.setPageStatus(QuranPDF.currentPage, status);
  renderQuran();
  if (status !== 'none') toast(status==='memorized' ? '✓ سُجّلت كمحفوظة' : '↺ سُجّلت للمراجعة');
}

function saveQuranSession() {
  const h = val('q-hafiz') || '0';
  const m = val('q-muraja3a') || '0';
  const n = val('q-notes');
  if (+h===0 && +m===0) { toast('أدخل عدد الصفحات', 'err'); return; }
  QuranDB.saveTodaySession(h, m, n);
  renderQuran(); renderDashboard(); toast('✓ تم تسجيل جلسة اليوم');
}

function filterSurahs(query) {
  const q = query.trim();
  document.querySelectorAll('.surah-item').forEach(item => {
    item.style.display = (!q || (item.getAttribute('data-name')||'').includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('.surah-juz-group').forEach(group => {
    const visible = [...group.querySelectorAll('.surah-item')].some(i => i.style.display !== 'none');
    group.style.display = visible ? '' : 'none';
  });
}

function cycleSurah(num) {
  const d = QuranDB.getData();
  const cur = (d.surahs || {})[num] || 'none';
  const next = cur === 'none' ? 'memorized' : cur === 'memorized' ? 'reviewing' : 'none';
  QuranDB.setSurah(num, next);
  renderQuran();
  const s = SURAHS.find(x=>x.n===num);
  if (next === 'memorized') toast(`✓ سورة ${s?.name} — محفوظة`);
  else if (next === 'reviewing') toast(`↺ سورة ${s?.name} — مراجعة`);
}

// ==========================================
// POMODORO STATE
// ==========================================
const POMO = {
  WORK: 50*60, SHORT: 5*60, LONG: 15*60,
  state: 'idle', // idle | work | short | long
  remaining: 50*60,
  sessionsDone: 0,
  accMins: 0,          // دقائق تراكمت من جلسات مكتملة
  _interval: null,
  _startTime: null,
  _totalSec: 50*60,

  start() {
    if (this.state === 'idle') {
      this.state = 'work'; this.remaining = this.WORK; this._totalSec = this.WORK;
    }
    this._startTime = Date.now() - (this._totalSec - this.remaining) * 1000;
    clearInterval(this._interval);
    this._interval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - this._startTime) / 1000);
      this.remaining = Math.max(0, this._totalSec - elapsed);
      if (this.remaining === 0) { this._onDone(); return; }
      this._updateUI();
    }, 500);
    this._updateUI();
  },

  pause() {
    clearInterval(this._interval); this._interval = null;
    this._updateUI();
  },

  reset() {
    clearInterval(this._interval); this._interval = null;
    this.state = 'idle'; this.remaining = this.WORK; this._totalSec = this.WORK;
    this._updateUI();
  },

  skip() {
    clearInterval(this._interval); this._interval = null;
    this._onDone();
  },

  _onDone() {
    clearInterval(this._interval); this._interval = null;
    if (this.state === 'work') {
      this.sessionsDone++;
      this.accMins += 50;
      // تشغيل صوت بسيط
      try { const ctx=new AudioContext(); const o=ctx.createOscillator(); const g=ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.frequency.value=880;
        g.gain.setValueAtTime(0.3,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8);
        o.start(); o.stop(ctx.currentTime+0.8); } catch(e){}
      // تحديد نوع الاستراحة
      this.state = this.sessionsDone % 4 === 0 ? 'long' : 'short';
      this.remaining = this.state === 'long' ? this.LONG : this.SHORT;
      this._totalSec = this.remaining;
      toast(`🎯 أنهيت جلسة! خذ استراحة ${this.state === 'long' ? 'طويلة ١٥د' : 'قصيرة ٥د'}`);
    } else {
      this.state = 'work'; this.remaining = this.WORK; this._totalSec = this.WORK;
      toast('⏰ انتهت الاستراحة! ابدأ من جديد');
    }
    this._updateUI();
  },

  _updateUI() {
    const mins = Math.floor(this.remaining / 60).toString().padStart(2,'0');
    const secs = (this.remaining % 60).toString().padStart(2,'0');
    const timeEl = document.getElementById('pomo-time');
    const phaseEl = document.getElementById('pomo-phase');
    const fillEl = document.getElementById('pomo-fill');
    const countEl = document.getElementById('pomo-count');
    const startBtn = document.getElementById('pomo-start');
    if (!timeEl) return;
    timeEl.textContent = `${mins}:${secs}`;
    const phases = { idle:'اضغط ابدأ', work:'وقت التركيز 🔥', short:'استراحة قصيرة ☕', long:'استراحة طويلة 🌿' };
    phaseEl.textContent = phases[this.state] || '';
    // الدائرة
    const pct = this._totalSec > 0 ? this.remaining / this._totalSec : 1;
    const R = 54; const C = 2 * Math.PI * R;
    fillEl.style.strokeDasharray = C;
    fillEl.style.strokeDashoffset = C * (1 - pct);
    const colors = { idle:'#555b6e', work:'#378ADD', short:'#1D9E75', long:'#7F77DD' };
    fillEl.style.stroke = colors[this.state] || '#555b6e';
    // زر البدء
    if (startBtn) {
      const running = this._interval !== null;
      startBtn.textContent = running ? '⏸ توقف' : (this.state==='idle' ? '▶ ابدأ' : '▶ استمر');
      startBtn.onclick = running ? () => POMO.pause() : () => POMO.start();
    }
    if (countEl) countEl.innerHTML = `جلسات مكتملة: <span>${this.sessionsDone}</span> &nbsp;|&nbsp; دقائق تراكمت: <span>${this.accMins}</span>`;
  },

  getHTML() {
    const R = 54; const C = 2 * Math.PI * R;
    return `<div class="pomo-wrap">
      <div class="pomo-ring">
        <svg width="130" height="130" viewBox="0 0 130 130">
          <circle class="pomo-ring-bg" cx="65" cy="65" r="${R}"/>
          <circle id="pomo-fill" class="pomo-ring-fill" cx="65" cy="65" r="${R}"
            stroke-dasharray="${C}" stroke-dashoffset="0"/>
        </svg>
        <div class="pomo-time" id="pomo-time">50:00</div>
        <div class="pomo-phase" id="pomo-phase">اضغط ابدأ</div>
      </div>
      <div class="pomo-controls">
        <button class="pomo-btn start" id="pomo-start" onclick="POMO.start()">▶ ابدأ</button>
        <button class="pomo-btn" onclick="POMO.reset()">↺ إعادة</button>
        <button class="pomo-btn" onclick="POMO.skip()">⏭ تخطي</button>
      </div>
      <div class="pomo-count" id="pomo-count">جلسات مكتملة: <span>0</span> &nbsp;|&nbsp; دقائق تراكمت: <span>0</span></div>
      <button class="btn-ghost" style="margin-top:8px;font-size:11px" onclick="pomoLog()">✓ سجّل الجلسة الآن</button>
    </div>`;
  }
};

function pomoLog() {
  const mins = POMO.accMins;
  const topic = val('code-topic').trim();
  if (!mins && !topic) { toast('اشتغل بومودورو أو أدخل بيانات الجلسة', 'err'); return; }
  const m = mins || +val('code-mins') || 0;
  const t = topic || `بومودورو × ${POMO.sessionsDone} جلسة`;
  if (!m) { toast('لا يوجد وقت لتسجيله', 'err'); return; }
  CodeDB.addLog(t, m);
  POMO.accMins = 0; POMO.sessionsDone = 0;
  renderCode(); renderDashboard(); toast('✓ تم تسجيل الجلسة');
}

function exportBackup() {
  const json = JSON.stringify(_data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = todayISOStr();
  a.href = url; a.download = `مركز_القيادة_backup_${d}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('✓ تم تنزيل النسخة الاحتياطية');
}

function importBackup(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm('هذا سيستبدل جميع بياناتك الحالية. هل أنت متأكد؟')) return;
      _data = data;
      localStorage.setItem(LS_KEY, JSON.stringify(_data));
      toast('✓ تم الاستيراد بنجاح');
      setTimeout(()=>navigate('dashboard'), 1000);
    } catch(err) { toast('⚠ ملف غير صالح', 'err'); }
  };
  reader.readAsText(file);
}

function clearAllData() {
  if (!confirm('⚠️ سيتم حذف جميع بياناتك نهائياً؟')) return;
  if (!confirm('تأكيد أخير!')) return;
  _data = {};
  localStorage.removeItem(LS_KEY);
  toast('تم الحذف');
  setTimeout(()=>navigate('dashboard'),1000);
}

const DailyDB = {
  getDay(iso) { return DB.get('daily_'+iso, null); },
  saveDay(iso, d) { DB.set('daily_'+iso, d); },
  initDay(iso) {
    let d = this.getDay(iso);
    if (!d) {
      d = {
        date: iso,
        // صلوات
        prayers: { fajr:false, dhuhr:false, asr:false, maghrib:false, isha:false },
        // ورد قرآني
        quran: { done:false, pages:0 },
        // استحمام
        shower: false,
        // أكل (3 وجبات)
        meals: { breakfast:false, lunch:false, dinner:false },
        // مياه (عدد أكواب)
        water: 0,
        // رياضة
        sport: false,
        // مذاكرة قانون
        law: { done:false, hours:0, notes:'' },
        // تعلم برمجة
        code: { done:false, mins:0, topic:'' },
        // كتاكيت (3 جولات)
        chicks: [
          { time:'صباح', done:false, count:0, health:'', feed:0, notes:'' },
          { time:'ظهر',  done:false, count:0, health:'', feed:0, notes:'' },
          { time:'مساء', done:false, count:0, health:'', feed:0, notes:'' },
        ],
        // طلاب
        students: { sessionDone:false, presentIds:[], notes:'' },
        // ملاحظة اليوم
        dayNote: '',
        // مزاج اليوم
        mood: 0,
      };
      this.saveDay(iso, d);
    }
    return d;
  }
};

let _dailyDate = todayISOStr();
let _calMonth = new Date().getMonth();
let _calYear = new Date().getFullYear();

function getDayPct(iso) {
  const d = DailyDB.getDay(iso);
  if (!d) return 0;
  const checks = [
    d.prayers.fajr, d.prayers.dhuhr, d.prayers.asr, d.prayers.maghrib, d.prayers.isha,
    d.quran.done, d.shower, d.meals.breakfast, d.meals.lunch, d.meals.dinner,
    d.water >= 6, d.sport, d.law.done, d.code.done,
    d.chicks[0].done, d.chicks[1].done, d.chicks[2].done, d.students.sessionDone,
  ];
  return Math.round(checks.filter(Boolean).length / checks.length * 100);
}

function renderDailyCalendar() {
  const today = todayISOStr();
  const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const dayNamesShort = ['أح','اث','ثل','أر','خم','جم','سب'];

  const selDate = new Date(_dailyDate + 'T00:00:00');
  const weekDays = [];
  const startOfWeek = new Date(selDate);
  startOfWeek.setDate(selDate.getDate() - selDate.getDay());
  for (let i = 0; i < 7; i++) {
    const d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate() + i);
    const iso = d.toISOString().split('T')[0];
    const pct = iso > today ? -1 : getDayPct(iso);
    weekDays.push({ iso, day: d.getDate(), dayName: dayNamesShort[d.getDay()], pct, isFuture: iso > today });
  }

  const monthLabel = monthNames[selDate.getMonth()] + ' ' + selDate.getFullYear();

  const dot = (pct) => {
    if (pct < 0) return '';
    const c = pct >= 80 ? '#1D9E75' : pct >= 50 ? '#BA7517' : '#E24B4A';
    return `<div style="width:5px;height:5px;border-radius:50%;background:${c};margin:2px auto 0"></div>`;
  };

  return `
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:0.75rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <button onclick="calWeekNav(-1)" style="background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:7px;padding:3px 9px;cursor:pointer;font-family:var(--font);font-size:12px">◀</button>
      <span style="font-size:12px;font-weight:700;color:var(--text)">${monthLabel}</span>
      <button onclick="calWeekNav(1)" style="background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:7px;padding:3px 9px;cursor:pointer;font-family:var(--font);font-size:12px">▶</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
      ${weekDays.map(w => {
        const isSelected = w.iso === _dailyDate;
        const isToday2 = w.iso === today;
        return `<div onclick="${w.isFuture ? '' : `selectDay('${w.iso}')`}"
          style="text-align:center;padding:5px 2px;border-radius:8px;cursor:${w.isFuture?'default':'pointer'};opacity:${w.isFuture?'0.3':'1'};
            background:${isSelected?'var(--accent)':'var(--bg3)'};
            border:1.5px solid ${isSelected?'var(--accent)':isToday2?'#378ADD':'var(--border2)'};
            transition:all 0.15s">
          <div style="font-size:9px;color:${isSelected?'rgba(255,255,255,0.7)':'var(--text3)'};font-weight:600;margin-bottom:2px">${w.dayName}</div>
          <div style="font-size:13px;font-weight:700;color:${isSelected?'#fff':isToday2?'#378ADD':'var(--text2)'}">${w.day}</div>
          ${isSelected ? '' : dot(w.pct)}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function calWeekNav(dir) {
  // تنقل بالأسبوع
  const d = new Date(_dailyDate + 'T00:00:00');
  d.setDate(d.getDate() + dir * 7);
  const today = todayISOStr();
  const iso = d.toISOString().split('T')[0];
  if (iso > today) return;
  _dailyDate = iso;
  renderDaily();
}

function selectDay(iso) {
  _dailyDate = iso;
  renderDaily();
  // scroll للتفاصيل
  setTimeout(() => {
    const detail = document.getElementById('daily-detail');
    if (detail) detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function dailyGoDay(offset) {
  const iso = addDaysToISO(_dailyDate, offset);
  if (iso > todayISOStr()) return;
  _dailyDate = iso;
  renderDaily();
}
function dailyGoToday() { _dailyDate = todayISOStr(); renderDaily(); }

function getDailyD() { return DailyDB.getDay(_dailyDate); }
function saveDailyD(d) { DailyDB.saveDay(_dailyDate, d); }

function setDailyMood(v) { const d=getDailyD(); d.mood=v; saveDailyD(d); renderDaily(); }
function toggleDailyPrayer(k) { const d=getDailyD(); d.prayers[k]=!d.prayers[k]; saveDailyD(d); renderDaily(); }
function toggleDailyQuran() { const d=getDailyD(); d.quran.done=!d.quran.done; saveDailyD(d); renderDaily(); }
function saveDailyQuranPages(v) { const d=getDailyD(); d.quran.pages=+v||0; saveDailyD(d); }
function toggleDailyShower() { const d=getDailyD(); d.shower=!d.shower; saveDailyD(d); renderDaily(); }
function toggleDailySport() { const d=getDailyD(); d.sport=!d.sport; saveDailyD(d); renderDaily(); }
function toggleDailyMeal(k) { const d=getDailyD(); d.meals[k]=!d.meals[k]; saveDailyD(d); renderDaily(); }
function adjustWater(n) { const d=getDailyD(); d.water=Math.max(0,Math.min(10,(d.water||0)+n)); saveDailyD(d); renderDaily(); }

function toggleDailyChick(i) { const d=getDailyD(); d.chicks[i].done=!d.chicks[i].done; saveDailyD(d); renderDaily(); }
function updateChick(i,field,val) { const d=getDailyD(); d.chicks[i][field]=field==='count'||field==='feed'?+val||0:val; saveDailyD(d); }
function saveDailyChick(i) { const d=getDailyD(); d.chicks[i].done=true; saveDailyD(d); renderDaily(); }

function toggleDailyLaw() { const d=getDailyD(); d.law.done=!d.law.done; saveDailyD(d); renderDaily(); }
function saveDailyLaw(field,val) { const d=getDailyD(); d.law[field]=field==='hours'?+val||0:val; saveDailyD(d); }
function toggleDailyCode() { const d=getDailyD(); d.code.done=!d.code.done; saveDailyD(d); renderDaily(); }
function saveDailyCode(field,val) { const d=getDailyD(); d.code[field]=field==='mins'?+val||0:val; saveDailyD(d); }
function toggleDailyStudents() { const d=getDailyD(); d.students.sessionDone=!d.students.sessionDone; saveDailyD(d); renderDaily(); }
function toggleDailyStudent(id) {
  const d=getDailyD();
  if(!d.students.presentIds) d.students.presentIds=[];
  if(d.students.presentIds.includes(id)) d.students.presentIds=d.students.presentIds.filter(x=>x!==id);
  else d.students.presentIds.push(id);
  saveDailyD(d);
}
function saveDailyStudentNotes(v) { const d=getDailyD(); d.students.notes=v; saveDailyD(d); }
function saveDailyNote(v) { const d=getDailyD(); d.dayNote=v; saveDailyD(d); }

function enterFocusMode(taskName) {

const SportsDB = {
  getData() {
    return DB.get('sports', {
      exercises: [
        { id:1, name:'تمرينات الضغط',   sets:3, reps:15, icon:'💪' },
        { id:2, name:'تمرينات البطن',    sets:3, reps:20, icon:'🔥' },
        { id:3, name:'القرفصاء',         sets:3, reps:15, icon:'🦵' },
        { id:4, name:'تمرين البلانك',    sets:3, reps:1,  icon:'⚡' },
        { id:5, name:'المشي أو الجري',  sets:1, reps:30, icon:'🏃' },
      ],
      log: {}
    });
  },
  save(d) { DB.set('sports', d); },
  toggleDone(date, exId) {
    const d = this.getData();
    if (!d.log[date]) d.log[date] = [];
    d.log[date] = d.log[date].includes(exId)
      ? d.log[date].filter(x => x !== exId)
      : [...d.log[date], exId];
    this.save(d); return d;
  },
  addExercise(name, sets, reps, icon) {
    const d = this.getData();
    d.exercises.push({ id: Date.now(), name, sets: +sets||3, reps: +reps||10, icon: icon||'💪' });
    this.save(d); return d;
  },
  delExercise(id) {
    const d = this.getData();
    d.exercises = d.exercises.filter(e => e.id !== id);
    this.save(d); return d;
  }
};

// ==========================================
// BUDGET DB
// ==========================================
const BudgetDB = {
  getData() { return DB.get('budget', { entries: [] }); },
  save(d) { DB.set('budget', d); },
  add(desc, amount, type, date) {
    const d = this.getData();
    d.entries.unshift({ id: Date.now(), desc, amount: +amount, type, date: date || todayStr() });
    this.save(d); return d;
  },
  del(id) {
    const d = this.getData();
    d.entries = d.entries.filter(e => e.id !== id);
    this.save(d); return d;
  },
  getMonthTotal(monthStr) {
    // monthStr = e.g. "5/2026"
    const d = this.getData();
    return d.entries
      .filter(e => e.date && e.date.includes('/' + monthStr.split('/')[1]) && e.date.startsWith(monthStr.split('/')[0].replace(/^(\d)$/, '0$1') + '/') || (e.date||'').includes('/' + monthStr.split('/')[1] + '/') && (e.date||'').startsWith(monthStr.split('/')[0] + '/'))
      .reduce((a, e) => a + (e.type === 'income' ? e.amount : -e.amount), 0);
  }
};

// ==========================================
// BOOKS DB
// ==========================================
const BooksDB = {
  getData() { return DB.get('books', { list: [] }); },
  save(d) { DB.set('books', d); },
  add(title, author, pages) {
    const d = this.getData();
    d.list.unshift({ id: Date.now(), title, author, pages: +pages||100, read: 0, status: 'reading' });
    this.save(d); return d;
  },
  del(id) { const d = this.getData(); d.list = d.list.filter(b => b.id !== id); this.save(d); return d; },
  updateRead(id, read) {
    const d = this.getData();
    d.list = d.list.map(b => {
      if (b.id !== id) return b;
      const r = Math.min(b.pages, Math.max(0, +read));
      return { ...b, read: r, status: r >= b.pages ? 'done' : 'reading' };
    });
    this.save(d); return d;
  }
};

function renderSports() {
  const d = SportsDB.getData();

// ==========================================
// SMART ALARM SYSTEM — تذكير المهام والصلاة
// ==========================================
let _alarmInterval = null;

function scheduleTaskAlarm() {
  if (_alarmInterval) clearInterval(_alarmInterval);
  _alarmInterval = setInterval(checkAlarms, 10000); // كل 10 ثواني
  checkAlarms(); // شغّل فوراً
}

function checkAlarms() {
  const todos = TodosDB.getAll();
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();

  todos.forEach(t => {
    if (t.done || !t.alarmTime || t.alarmFired) return;
    const [ah, am] = t.alarmTime.split(':').map(Number);
    const alarmMins = ah * 60 + am;

    if (Math.abs(alarmMins - nowMins) <= 1) {
      // إشعار المتصفح
      if (Notification.permission === 'granted') {
        try {
          new Notification('⏰ تذكير مهمة!', { body: t.text, icon: '' });
        } catch(e) {}
      }
      // تنبيه داخلي واضح
      showAlarmBanner(t.text);
      toast('⏰ تذكير: ' + t.text, 'ok');
      // علّم كمُشعَر
      const all = TodosDB.getAll().map(x => x.id === t.id ? {...x, alarmFired: true} : x);
      TodosDB.save(all);
      renderTodos();
    }
  });
}

function showAlarmBanner(taskText) {
  // إزالة أي بانر قديم
  const old = document.getElementById('task-alarm-banner');
  if (old) old.remove();

  const banner = document.createElement('div');
  banner.id = 'task-alarm-banner';
  banner.style.cssText = [
    'position:fixed', 'top:20px', 'left:50%', 'transform:translateX(-50%)',
    'background:linear-gradient(135deg,#E24B4A,#BA3A39)',
    'color:#fff', 'border-radius:14px', 'padding:16px 24px',
    'box-shadow:0 8px 32px rgba(226,75,74,0.5)',
    'z-index:99999', 'text-align:center', 'min-width:280px', 'max-width:90vw',
    'font-family:Cairo,sans-serif', 'animation:alarmPop 0.4s ease'
  ].join(';');

  banner.innerHTML = '<div style="font-size:28px;margin-bottom:6px">⏰</div>'
    + '<div style="font-size:15px;font-weight:700;margin-bottom:4px">تذكير!</div>'
    + '<div style="font-size:13px;opacity:0.9;margin-bottom:12px">' + taskText + '</div>'
    + '<button onclick="document.getElementById(\'task-alarm-banner\').remove()" '
    + 'style="background:rgba(255,255,255,0.25);border:1px solid rgba(255,255,255,0.5);'
    + 'color:#fff;border-radius:8px;padding:6px 20px;cursor:pointer;font-family:Cairo,sans-serif;font-size:13px;font-weight:600">✓ تم</button>';

  document.body.appendChild(banner);

  // صوت تنبيه
  try {
    const ctx = new AudioContext();
    [0, 0.3, 0.6].forEach(delay => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.4, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.4);
      o.start(ctx.currentTime + delay);
      o.stop(ctx.currentTime + delay + 0.4);
    });
  } catch(e) {}

  // إغلاق تلقائي بعد 15 ثانية
  setTimeout(() => { if (banner.parentNode) banner.remove(); }, 15000);
}

const PRAYER = {
  names: [
    { key: 'fajr',    ar: 'الفجر',   icon: '🌄', adhanKey: 'fajr'    },
    { key: 'dhuhr',   ar: 'الظهر',   icon: '☀️',  adhanKey: 'dhuhr'   },
    { key: 'asr',     ar: 'العصر',   icon: '🌤️', adhanKey: 'asr'     },
    { key: 'maghrib', ar: 'المغرب',  icon: '🌅', adhanKey: 'maghrib' },
    { key: 'isha',    ar: 'العشاء',  icon: '🌙', adhanKey: 'isha'    },
  ],
  times: {},        // { fajr: Date, dhuhr: Date, ... }
  notifs: {},       // { fajr: true, ... }
  _countdownTimer: null,
  _scheduledNotifs: {},

  getSettings() {
    return DB.get('prayerSettings', { lat: null, lng: null, city: '', method: 'MuslimWorldLeague', notifs: {} });
  },
  saveSettings(s) { DB.set('prayerSettings', s); },

  calcTimes(lat, lng, date, method) {
    if (typeof adhan === 'undefined') return null;
    const coords = new adhan.Coordinates(lat, lng);
    const methodMap = {
      MuslimWorldLeague:  adhan.CalculationMethod.MuslimWorldLeague(),
      Egyptian:           adhan.CalculationMethod.Egyptian(),
      Karachi:            adhan.CalculationMethod.Karachi(),
      UmmAlQura:          adhan.CalculationMethod.UmmAlQura(),
      Dubai:              adhan.CalculationMethod.Dubai(),
      MoonsightingCommittee: adhan.CalculationMethod.MoonsightingCommittee(),
      NorthAmerica:       adhan.CalculationMethod.NorthAmerica(),
    };
    const params = methodMap[method] || adhan.CalculationMethod.MuslimWorldLeague();
    const d = date || new Date();
    const prayerDate = new adhan.DateComponents(d.getFullYear(), d.getMonth() + 1, d.getDate());
    const pt = new adhan.PrayerTimes(coords, prayerDate, params);
    return { fajr: pt.fajr, dhuhr: pt.dhuhr, asr: pt.asr, maghrib: pt.maghrib, isha: pt.isha };
  },

  fmt(date) {
    if (!date) return '--:--';
    return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true });
  },

  getNextPrayer() {
    const now = new Date();
    for (const p of this.names) {
      const t = this.times[p.key];
      if (t && t > now) return p;
    }
    return null; // كل الصلوات انتهت
  },

  countdown() {
    const now = new Date();
    let next = null;
    let nextTime = null;
    for (const p of this.names) {
      const t = this.times[p.key];
      if (t && t > now) { next = p; nextTime = t; break; }
    }
    const el = document.getElementById('prayer-countdown-time');
    const label = document.getElementById('prayer-countdown-next');
    if (!el) return;
    if (!next || !nextTime) {
      el.textContent = '--:--:--';
      if (label) label.textContent = 'انتهت صلوات اليوم';
      return;
    }
    const diff = Math.max(0, Math.floor((nextTime - now) / 1000));
    const h = Math.floor(diff / 3600);
    const m = Math.floor((diff % 3600) / 60);
    const s = diff % 60;
    el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (label) label.textContent = `حتى ${next.ar} ${next.icon} — ${this.fmt(nextTime)}`;
  },

  scheduleNotifications() {
    const settings = this.getSettings();
    // إلغاء القديمة
    Object.values(this._scheduledNotifs).forEach(clearTimeout);
    this._scheduledNotifs = {};

    if (!settings.inAppNotif) return;
    const now = new Date();

    this.names.forEach(p => {
      if (!settings.notifs[p.key]) return;
      const t = this.times[p.key];
      if (!t || t <= now) return;

      // تنبيه 5 دقائق قبل
      const delay5 = t - now - (5 * 60 * 1000);
      if (delay5 > 0) {
        this._scheduledNotifs[p.key + '_pre'] = setTimeout(() => {
          PRAYER.showInAppAlert('⏰ ' + p.ar + ' بعد 5 دقائق', 'استعد للصلاة — ' + PRAYER.fmt(t), p.icon);
        }, delay5);
      }

      // تنبيه عند دخول الوقت
      const delayNow = t - now;
      if (delayNow > 0) {
        this._scheduledNotifs[p.key + '_now'] = setTimeout(() => {
          PRAYER.showInAppAlert('🕌 حان وقت ' + p.ar, 'الوقت: ' + PRAYER.fmt(t), p.icon);
          PRAYER.playAdhanSound();
        }, delayNow);
      }
    });
  },

  showInAppAlert(title, body, icon) {
    // إزالة أي تنبيه قديم
    const old = document.getElementById('prayer-alert-banner');
    if(old) old.remove();

    const banner = document.createElement('div');
    banner.id = 'prayer-alert-banner';
    banner.style.cssText = [
      'position:fixed', 'top:20px', 'left:50%', 'transform:translateX(-50%)',
      'z-index:99999', 'background:linear-gradient(135deg,#0e6e50,#1D9E75)',
      'color:#fff', 'border-radius:16px', 'padding:16px 24px',
      'box-shadow:0 8px 32px rgba(0,0,0,0.5)', 'text-align:center',
      'min-width:280px', 'max-width:90vw', 'direction:rtl',
      'animation:slideDown 0.4s ease'
    ].join(';');
    banner.innerHTML = '<div style="font-size:28px;margin-bottom:6px">' + (icon||'🕌') + '</div>'
      + '<div style="font-size:16px;font-weight:700;margin-bottom:4px">' + title + '</div>'
      + '<div style="font-size:13px;opacity:0.85">' + body + '</div>'
      + '<button onclick="document.getElementById(\'prayer-alert-banner\').remove()" '
      + 'style="margin-top:12px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);'
      + 'color:#fff;border-radius:8px;padding:6px 20px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600">✓ تم</button>';

    // إضافة animation CSS لو مش موجودة
    if(!document.getElementById('prayer-anim-style')) {
      const st = document.createElement('style');
      st.id = 'prayer-anim-style';
      st.textContent = '@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}';
      document.head.appendChild(st);
    }

    document.body.appendChild(banner);
    // يختفي تلقائي بعد 30 ثانية
    setTimeout(() => { if(banner.parentNode) banner.remove(); }, 30000);
  },

  playAdhanSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [392, 440, 494, 523, 494, 440, 392];
      let time = ctx.currentTime;
      notes.forEach(freq => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = freq;
        o.type = 'sine';
        g.gain.setValueAtTime(0, time);
        g.gain.linearRampToValueAtTime(0.3, time + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
        o.start(time); o.stop(time + 0.5);
        time += 0.4;
      });
    } catch(e) {}
  },

  toggleNotif(key) {
    const s = this.getSettings();
    s.notifs[key] = !s.notifs[key];
    this.saveSettings(s);
    this.scheduleNotifications();
    this.initUI();
  },

  async requestNotifPermission() {
    // تفعيل الإشعارات الداخلية دايماً (مش محتاج إذن)
    const s = this.getSettings();
    s.inAppNotif = true;
    this.saveSettings(s);

    if ('Notification' in window && Notification.permission === 'default') {

  async fetchLocation() {
    const s = this.getSettings();
    if (!navigator.geolocation) { toast('المتصفح لا يدعم GPS', 'err'); return; }
    toast('⏳ جاري تحديد موقعك...');
    navigator.geolocation.getCurrentPosition(
      async pos => {
        s.lat = pos.coords.latitude;
        s.lng = pos.coords.longitude;
        // محاولة الحصول على اسم المدينة
        try {
          const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${s.lat}&lon=${s.lng}&format=json&accept-language=ar`);
          const d = await r.json();
          s.city = d.address.city || d.address.town || d.address.village || d.address.county || `${s.lat.toFixed(2)}, ${s.lng.toFixed(2)}`;
        } catch(e) { s.city = `${s.lat.toFixed(2)}, ${s.lng.toFixed(2)}`; }
        this.saveSettings(s);
        this.loadAndRender();
        toast('✓ تم تحديد الموقع: ' + s.city);
      },
      err => {
        let msg = 'تعذّر تحديد الموقع';
        if(err.code === 1) msg = '⚠ يجب السماح بالوصول للموقع من إعدادات المتصفح';
        else if(err.code === 2) msg = '⚠ تعذّر تحديد الموقع — جرب مرة أخرى';
        else if(err.code === 3) msg = '⚠ انتهت مهلة تحديد الموقع — جرب مرة أخرى';
        toast(msg, 'err');
        // إذا رفض المستخدم، اقترح إدخال يدوي

        <div class="countdown-label">الوقت المتبقي للصلاة القادمة</div>
        <div class="countdown-time" id="prayer-countdown-time">--:--:--</div>
        <div class="countdown-next" id="prayer-countdown-next">...</div>
      </div>` : `
      <div style="text-align:center;padding:20px;color:var(--text3);font-size:13px;border:1px dashed var(--border);border-radius:10px;margin-bottom:0.75rem">
        📍 حدد موقعك لرؤية مواقيت الصلاة
      </div>`}

      <!-- الإشعارات -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;padding:8px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px">
        <span style="font-size:12px;color:var(--text2)">🔔 إشعارات الصلاة</span>
        ${settings.inAppNotif
          ? '<span style="font-size:11px;color:var(--accent);font-weight:600">✓ مفعّل</span>'
          : '<button class="btn" style="font-size:11px;padding:5px 12px" onclick="PRAYER.requestNotifPermission()">تفعيل التذكيرات</button>'
        }
      </div>

      <!-- قائمة الصلوات -->
      <div class="prayer-card">
        ${this.names.map(p => {
          const t = this.times[p.key];
          const prayed = todayD && todayD.prayers[p.key];
          const isNext = next && next.key === p.key;
          const notifOn = s.notifs[p.key];
          return `<div class="prayer-row${isNext?' next-prayer':''}">
            <div class="prayer-icon">${p.icon}</div>
            <div class="prayer-info">
              <div class="prayer-name">${p.ar} ${isNext?'<span class="next-badge">القادمة</span>':''}</div>
              <div class="prayer-time-display">${t ? PRAYER.fmt(t) : '---'}</div>
            </div>
            <button class="prayer-notif-btn${notifOn?' on':''}" onclick="PRAYER.toggleNotif('${p.key}')" title="${notifOn?'إلغاء الإشعار':'تفعيل الإشعار'}">🔔</button>
            <button class="prayer-check-btn${prayed?' prayed':''}" onclick="toggleDailyPrayer('${p.key}');PRAYER.initUI()">
              ${prayed?'✓':''}
            </button>
          </div>`;
        }).join('')}
      </div>
    `;

    // ابدأ الكاونت داون فوراً
    if (Object.keys(this.times).length > 0) this.countdown();
  },

  changeMethod(method) {
    const s = this.getSettings();
    s.method = method;
    this.saveSettings(s);
    this.loadAndRender();
  }
};

// تحميل الصلاة عند بدء التطبيق
function initPrayerOnLoad() {
  const s = PRAYER.getSettings();
  if (s.lat && s.lng) {
    const t = PRAYER.calcTimes(s.lat, s.lng, new Date(), s.method);
    if (t) { PRAYER.times = t; }
  }
}

function renderPrayerTabHTML(iso) {
  return `<div id="prayer-tab-content"><div style="text-align:center;padding:30px;color:var(--text3)">جاري التحميل...</div></div>`;
}
</script>
<!-- ===== DEEP FOCUS OVERLAY ===== -->
<div class="focus-overlay" id="focus-overlay">
  <div class="focus-label">🎯 وضع التركيز العميق</div>
  <div class="focus-task-name" id="focus-task-display"></div>
  <div id="focus-pomo-container"></div>
  <button class="focus-exit-btn" onclick="exitFocusMode()">✕ خروج من وضع التركيز</button>
</div>

</body>
</html>
